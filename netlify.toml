[build]
  publish = "."

# ─────────────────────────────────────────────────────────────────
# Security headers — applied to every response
# ─────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Already enforced at Cloudflare/Netlify edge, but explicit is safer
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Block clickjacking — site cannot be framed by other origins
    X-Frame-Options = "DENY"
    # Prevent MIME-sniffing attacks
    X-Content-Type-Options = "nosniff"
    # Don't leak full URL on outbound nav
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disable powerful browser APIs we don't use
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    # Cross-origin isolation
    X-XSS-Protection = "1; mode=block"
    # Content Security Policy — restrict where scripts/media/styles can come from
    # NOTE: 'unsafe-inline' + 'unsafe-eval' required for Tailwind CDN runtime.
    # Replace Tailwind CDN with a compiled stylesheet to remove these directives.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com https://cdn.fontshare.com; font-src 'self' data: https://fonts.gstatic.com https://api.fontshare.com https://cdn.fontshare.com; img-src 'self' data: https://cdn.simpleicons.org; media-src 'self' https://d8j0ntlcm91z4.cloudfront.net https://stream.mux.com; connect-src 'self' https://stream.mux.com https://cdn.tailwindcss.com; frame-ancestors 'none'; form-action 'self' https://form.typeform.com; base-uri 'self'; object-src 'none'"

# Cache static assets aggressively
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"
