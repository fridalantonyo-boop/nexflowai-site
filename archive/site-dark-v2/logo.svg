<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#080809"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c96a"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#a07c2a"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0"/>
      <stop offset="30%" stop-color="#e8c96a" stop-opacity="1"/>
      <stop offset="70%" stop-color="#c9a84c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Subtle gold ambient glow behind letters -->
  <ellipse cx="200" cy="195" rx="110" ry="90" fill="#c9a84c" opacity="0.04"/>

  <!-- Circuit line decoration — horizontal connector -->
  <line x1="60" y1="200" x2="340" y2="200" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.35"/>

  <!-- Small circuit nodes -->
  <circle cx="90" cy="200" r="2.5" fill="#c9a84c" opacity="0.5"/>
  <circle cx="310" cy="200" r="2.5" fill="#c9a84c" opacity="0.5"/>
  <circle cx="150" cy="200" r="1.5" fill="#c9a84c" opacity="0.3"/>
  <circle cx="250" cy="200" r="1.5" fill="#c9a84c" opacity="0.3"/>

  <!-- Vertical tick marks from circuit line -->
  <line x1="90" y1="192" x2="90" y2="208" stroke="#c9a84c" stroke-width="0.7" opacity="0.4"/>
  <line x1="310" y1="192" x2="310" y2="208" stroke="#c9a84c" stroke-width="0.7" opacity="0.4"/>

  <!-- N letter — elegant serif style via paths -->
  <!-- Left vertical stroke of N -->
  <rect x="102" y="118" width="18" height="168" fill="url(#gold)" rx="1"/>
  <!-- Right vertical stroke of N -->
  <rect x="214" y="118" width="18" height="168" fill="url(#gold)" rx="1"/>
  <!-- Diagonal stroke of N -->
  <polygon points="102,118 120,118 232,268 214,268" fill="url(#gold)"/>

  <!-- F letter -->
  <!-- Vertical stroke of F -->
  <rect x="248" y="118" width="18" height="168" fill="url(#gold)" rx="1"/>
  <!-- Top horizontal bar -->
  <rect x="248" y="118" width="80" height="16" fill="url(#gold)" rx="1"/>
  <!-- Middle horizontal bar -->
  <rect x="248" y="188" width="62" height="14" fill="url(#gold)" rx="1"/>

  <!-- Thin serif feet on N - left bottom -->
  <rect x="90" y="274" width="42" height="6" fill="url(#gold)" rx="1" opacity="0.9"/>
  <!-- Thin serif feet on N - right bottom -->
  <rect x="202" y="274" width="42" height="6" fill="url(#gold)" rx="1" opacity="0.9"/>
  <!-- Thin serif caps on N - left top -->
  <rect x="90" y="118" width="42" height="6" fill="url(#gold)" rx="1" opacity="0.9"/>
  <!-- Thin serif caps on N - right top -->
  <rect x="202" y="118" width="42" height="6" fill="url(#gold)" rx="1" opacity="0.9"/>
  <!-- Serif cap F top -->
  <rect x="236" y="118" width="42" height="6" fill="url(#gold)" rx="1" opacity="0.9"/>
  <!-- Serif foot F bottom -->
  <rect x="236" y="274" width="42" height="6" fill="url(#gold)" rx="1" opacity="0.9"/>

  <!-- Dot accent between N and F -->
  <circle cx="238" cy="195" r="4" fill="#c9a84c" opacity="0.6" filter="url(#glow)"/>

  <!-- Corner accent marks — top left -->
  <line x1="28" y1="28" x2="60" y2="28" stroke="#c9a84c" stroke-width="1.5" opacity="0.35"/>
  <line x1="28" y1="28" x2="28" y2="60" stroke="#c9a84c" stroke-width="1.5" opacity="0.35"/>
  <!-- Corner accent marks — top right -->
  <line x1="372" y1="28" x2="340" y2="28" stroke="#c9a84c" stroke-width="1.5" opacity="0.35"/>
  <line x1="372" y1="28" x2="372" y2="60" stroke="#c9a84c" stroke-width="1.5" opacity="0.35"/>
  <!-- Corner accent marks — bottom left -->
  <line x1="28" y1="372" x2="60" y2="372" stroke="#c9a84c" stroke-width="1.5" opacity="0.35"/>
  <line x1="28" y1="372" x2="28" y2="340" stroke="#c9a84c" stroke-width="1.5" opacity="0.35"/>
  <!-- Corner accent marks — bottom right -->
  <line x1="372" y1="372" x2="340" y2="372" stroke="#c9a84c" stroke-width="1.5" opacity="0.35"/>
  <line x1="372" y1="372" x2="372" y2="340" stroke="#c9a84c" stroke-width="1.5" opacity="0.35"/>
</svg>
